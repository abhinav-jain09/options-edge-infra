# Failover node B for the two-node Kafka/k3s HA build-out.
# SSH-based: run from a workstation/Jenkins. abhinav has NOPASSWD sudo on 56,
# so become uses sudo here (no become password needed), overriding the su default.
# Provide the SSH password with -e ansible_password=... (or use an SSH key).
[failover_node]
oe-failover-56 ansible_host=192.168.100.56

[failover_node:vars]
ansible_user=abhinav
ansible_become=true
ansible_become_method=sudo
