# Primary node A (control-plane + Kafka brokers 1/2/3) for the two-node HA build-out.
# This host is hardened: the abhinav user's sudo is restricted to the
# options-edge-system-control wrapper, so privileged file edits require su.
# Provide both passwords at runtime (SSH and su-root):
#   -e ansible_password=...  -e ansible_become_password=...
[primary_node]
oe-primary-252 ansible_host=192.168.100.252

[primary_node:vars]
ansible_user=abhinav
ansible_become=true
ansible_become_method=su
